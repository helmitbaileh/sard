<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>السردية | SARD</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Rakkas&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #faf8f4;
      color: #2b3327;
      font-family: 'Alexandria', sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .paper-texture {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    
    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: #faf8f4;
      color: #314026;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.4s ease-out;
    }

    #loadingScreen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .stage {
      display: flex;
      align-items: baseline;
      justify-content: center;
      position: relative;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.3s ease-out, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .stage.stage-visible {
      opacity: 1;
      transform: scale(1);
    }

    .letter-part {
      font-family: 'Rakkas', serif;
      font-size: clamp(6.8rem, 15.5vw, 12rem);
      font-weight: 700;
      line-height: 1;
      color: #314026;
      display: inline-block;
      white-space: nowrap;
      vertical-align: baseline;
      will-change: transform, opacity;
    }

    
    .gap-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      height: clamp(5.4rem, 12.8vw, 9.8rem);
      width: 0px;
      overflow: visible;
      vertical-align: baseline;
      will-change: width;
      transition: width 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }

    
    .icon-box {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #314026;
      fill: #314026;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .icon-box img,
    .icon-box svg {
      height: 100%;
      width: 100%;
      object-fit: contain;
      display: block;
    }

    
    .icon-box.first-enter {
      animation: firstIconSilk 0.38s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    @keyframes firstIconSilk {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(0.85) rotate(-13deg);
      }
      100% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) scale(1.0) rotate(0deg);
      }
    }

    
    .icon-box.relay-enter {
      animation: relayEnterSilk 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }

    @keyframes relayEnterSilk {
      0% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(0.86);
      }
      100% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) scale(1.0);
      }
    }

    
    .icon-box.relay-exit {
      animation: relayExitSilk 0.22s cubic-bezier(0.3, 0, 0.2, 1) forwards;
    }

    @keyframes relayExitSilk {
      0% {
        opacity: 1;
        transform: translate3d(-50%, -50%, 0) scale(1.0);
      }
      100% {
        opacity: 0;
        transform: translate3d(-50%, -50%, 0) scale(0.86);
      }
    }

    
    .stage.anticipation-slide-down {
      animation: stageSlideDown 0.54s cubic-bezier(0.35, 0, 0.15, 1) forwards;
    }

    @keyframes stageSlideDown {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 1;
      }
      22% {
        transform: translate3d(0, -14px, 0) scale(0.99);
        opacity: 1;
      }
      100% {
        transform: translate3d(0, 95px, 0) scale(1.05);
        opacity: 0;
      }
    }

    
    #landingPage {
      display: none;
      min-height: 100vh;
      background-color: #faf8f4;
      color: #2b3327;
      flex-direction: column;
      position: relative;
    }

    #landingPage.active {
      display: flex;
    }

    .skeleton-pill {
      height: 10px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(4px);
      display: inline-block;
    }

    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-bg-photo {
      position: absolute;
      inset: -5% -5% -5% -5%;
      width: 110%;
      height: 110%;
      object-fit: cover;
      object-position: center 32%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .hero-veil {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, 
        rgba(0, 0, 0, 0.22) 0%, 
        transparent 25%, 
        transparent 72%, 
        rgba(250, 248, 244, 0.5) 92%, 
        rgba(250, 248, 244, 1) 100%
      );
      pointer-events: none;
      z-index: 12;
    }

    .extended-title {
      font-family: 'Alexandria', sans-serif;
      font-size: clamp(2.8rem, 7.8vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      line-height: 1;
      will-change: transform;
    }

    .hero-center-block {
      position: relative;
      z-index: 20;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin-top: -6vh;
    }

    .plain-text-section {
      width: 100%;
      min-height: 85vh;
      background-color: #faf8f4;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .pure-text {
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      font-weight: 500;
      color: #666666;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="paper-texture"></div>

  
  <div id="loadingScreen" onclick="skipToFinish()">
    <div class="stage" id="stageContainer">
      <span class="letter-part" id="partRight">سـ</span>
      
      <div class="gap-slot" id="gapSlot">
        
      </div>

      <span class="letter-part" id="partLeft">ـرد</span>
    </div>
  </div>

  
  <div id="landingPage">

    <section class="hero-container" id="heroSection">
      
      <img src="assets/nablus_nasr.png" alt="نابلس - جامع النصر وبرج المنارة" class="hero-bg-photo" id="heroPhoto">

      <div class="hero-veil"></div>

      
      <header class="relative z-30 w-full px-6 md:px-12 py-7 flex items-center justify-between">
        
        <div class="flex items-center gap-6">
          <button class="w-8 h-8 flex flex-col justify-center items-center gap-1.5 hover:opacity-75 transition" title="القائمة">
            <span class="w-6 h-0.5 bg-white rounded-full"></span>
            <span class="w-6 h-0.5 bg-white rounded-full"></span>
            <span class="w-6 h-0.5 bg-white rounded-full"></span>
          </button>

          <button class="p-1 hover:opacity-75 transition" title="بحث">
            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>

          <div class="hidden md:flex items-center gap-5 mr-2">
            <div class="skeleton-pill" style="width: 70px;"></div>
            <div class="skeleton-pill" style="width: 55px;"></div>
            <div class="skeleton-pill" style="width: 80px;"></div>
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div class="skeleton-pill" style="width: 50px;"></div>
          <div class="skeleton-pill" style="width: 60px;"></div>
        </div>

      </header>

      <div class="hero-center-block" id="heroCenterBlock">
        <h1 class="extended-title" id="mainTitle">
          الســــــرديــــــة
        </h1>
      </div>

      <div class="relative z-20 w-full pb-8"></div>

    </section>

    
    <section class="plain-text-section">
      <p class="pure-text">هون رح احط باقي العناصر</p>
    </section>

  </div>

            <path d="M 108 24 C 98 14 86 16 78 22 C 90 28 98 27 108 24 Z"/>
            <path d="M 108 24 C 111 34 107 42 98 48 C 96 36 101 29 108 24 Z"/>
            <path d="M 78 36 C 64 28 54 30 46 36 C 59 40 68 39 78 36 Z"/>
            <path d="M 76 42 C 80 54 76 64 66 72 C 67 58 70 48 76 42 Z"/>
            <path d="M 48 56 C 34 46 24 48 16 56 C 29 60 38 59 48 56 Z"/>
            <path d="M 45 60 C 48 72 44 80 34 88 C 36 74 39 66 45 60 Z"/>
            <ellipse cx="68" cy="58" rx="5.5" ry="8" transform="rotate(-20 68 58)"/>
            <ellipse cx="46" cy="74" rx="5.2" ry="7.6" transform="rotate(25 46 74)"/>
            <ellipse cx="92" cy="42" rx="4.8" ry="7" transform="rotate(-15 92 42)"/>
          </svg>
        `
      },

      
      
      {
        ratio: 0.88,
        content: `
          <svg viewBox="0 0 92 115" fill="currentColor">
            
            <circle cx="46" cy="27" r="27"/>
            <circle cx="46" cy="27" r="11" fill="#faf8f4"/>
            <circle cx="46" cy="10" r="3" fill="#faf8f4"/>
            
            <rect x="36" y="52" width="20" height="4.5" rx="1.5"/>
            <rect x="38" y="58" width="16" height="3" rx="1"/>
            
            <rect x="41" y="61" width="10" height="46" rx="1.5"/>
            
            <path d="M 51 83 L 76 83 L 76 108 L 62 108 L 62 96 L 51 96 Z"/>
            <rect x="56" y="88" width="7" height="13" fill="#faf8f4"/>
          </svg>
        `
      }
    ];

    const stageContainer = document.getElementById('stageContainer');
    const gapSlot = document.getElementById('gapSlot');
    const loadingScreen = document.getElementById('loadingScreen');
    const landingPage = document.getElementById('landingPage');

    let isRunning = false;
    let timeouts = [];

    function clearAllTimers() {
      timeouts.forEach(t => clearTimeout(t));
      timeouts = [];
    }

    function queue(fn, delay) {
      const t = setTimeout(fn, delay);
      timeouts.push(t);
      return t;
    }

    function getBaseHeight() {
      return gapSlot.clientHeight || 115;
    }

    
    
    function showIcon(index, isFirst = false) {
      const item = PALESTINIAN_ICONS[index];
      const h = getBaseHeight();
      const targetWidth = Math.round(h * item.ratio);

      
      gapSlot.style.width = targetWidth + 'px';

      
      const oldBox = gapSlot.querySelector('.icon-box:not(.relay-exit)');
      if (oldBox) {
        oldBox.className = 'icon-box relay-exit';
        setTimeout(() => oldBox.remove(), 220);
      }

      
      const newBox = document.createElement('div');
      newBox.className = isFirst ? 'icon-box first-enter' : 'icon-box relay-enter';
      newBox.innerHTML = item.content;
      gapSlot.appendChild(newBox);
    }

    function runSequence() {
      if (isRunning) return;
      isRunning = true;
      clearAllTimers();

      stageContainer.className = 'stage';
      gapSlot.style.width = '0px';
      gapSlot.innerHTML = '';
      void stageContainer.offsetWidth;

      
      stageContainer.classList.add('stage-visible');

      
      queue(() => { showIcon(0, true); }, 80);

      
      queue(() => { showIcon(1, false); }, 540);

      
      queue(() => { showIcon(2, false); }, 980);

      
      queue(() => { showIcon(3, false); }, 1420);

      
      queue(() => {
        const lastBox = gapSlot.querySelector('.icon-box');
        if (lastBox) {
          lastBox.className = 'icon-box relay-exit';
          setTimeout(() => lastBox.remove(), 200);
        }
      }, 1860);

      
      queue(() => {
        gapSlot.style.width = '0px';
      }, 1960);

      
      queue(() => {
        stageContainer.classList.add('anticipation-slide-down');
      }, 2300);

      
      queue(() => {
        loadingScreen.classList.add('fade-out');
        queue(() => {
          loadingScreen.style.display = 'none';
          landingPage.classList.add('active');
          document.body.style.overflow = 'auto';
          isRunning = false;
        }, 350);
      }, 2780);
    }

    function skipToFinish() {
      clearAllTimers();
      loadingScreen.classList.add('fade-out');
      setTimeout(() => {
        loadingScreen.style.display = 'none';
        landingPage.classList.add('active');
        document.body.style.overflow = 'auto';
        isRunning = false;
      }, 300);
    }

    
    const heroPhoto = document.getElementById('heroPhoto');
    const heroCenterBlock = document.getElementById('heroCenterBlock');

    let scrollY = 0;
    let mouseX = 0, mouseY = 0;
    let targetMouseX = 0, targetMouseY = 0;

    window.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      targetMouseX = (e.clientX - cx) / cx;
      targetMouseY = (e.clientY - cy) / cy;
    }, { passive: true });

    window.addEventListener('scroll', () => {
      scrollY = window.pageYOffset || document.documentElement.scrollTop;
    }, { passive: true });

    function renderParallax() {
      mouseX += (targetMouseX - mouseX) * 0.05;
      mouseY += (targetMouseY - mouseY) * 0.05;

      if (scrollY < window.innerHeight * 1.5) {
        heroPhoto.style.transform = `translate3d(${mouseX * 10}px, ${scrollY * 0.18 + mouseY * 5}px, 0)`;
        heroCenterBlock.style.transform = `translate3d(0, ${scrollY * 0.32}px, 0)`;
      }

      requestAnimationFrame(renderParallax);
    }

    requestAnimationFrame(renderParallax);

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(runSequence, 180);
    });
  </script>
